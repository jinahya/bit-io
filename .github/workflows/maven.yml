name: Java CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Java ${{ matrix.java }} / Maven
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 8 is the baseline; 21 compiles with release 8 (jdk9+ profile), which also checks the Java 8 API surface
        java: [ '8', '21' ]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Verify
        run: mvn -B -ntp verify

  kotlin-compat:
    name: Kotlin ${{ matrix.kotlin }} / Java ${{ matrix.java }} / Maven
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - kotlin: '1.3.72'
            java: '8'
          - kotlin: '2.4.20-Beta1'
            java: '11'

    env:
      PROFILE: kotlin-compat-${{ matrix.kotlin }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Test
        run: mvn -B -ntp -P"$PROFILE" test

      - name: Confirm Kotlin compatibility tests ran
        run: |
          found=0
          for source in $(find "src/test/$PROFILE" -name 'Kotlin*CompatibilityTest.kt'); do
            class=$(basename "$source" .kt)
            package=$(sed -n 's/^package \(.*\)$/\1/p' "$source")
            report="target/surefire-reports/TEST-$package.$class.xml"
            tests=$(sed -n 's/.*<testsuite [^>]*tests="\([0-9]*\)".*/\1/p' "$report" 2>/dev/null | head -1)
            if [ -z "$tests" ] || [ "$tests" -eq 0 ]; then
              echo "::error::$package.$class did not run under $PROFILE"
              exit 1
            fi
            echo "$package.$class: $tests test(s)"
            found=$((found + 1))
          done
          [ "$found" -gt 0 ] || { echo "::error::no Kotlin*CompatibilityTest sources found for $PROFILE"; exit 1; }

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports-${{ env.PROFILE }}
          path: target/surefire-reports/
